# Cuatro instancias de PostgreSQL, una por microservicio.
# Levantar todo:   docker compose up -d
# Ver el estado:   docker compose ps
# Apagar:          docker compose down          (agregar -v para borrar los datos)
services:
  db_ms1:
    image: postgres:16
    container_name: sgtm_db_ms1
    environment:
      POSTGRES_USER: taller
      POSTGRES_PASSWORD: taller
      POSTGRES_DB: taller_ms1
    ports: ["5433:5432"]
    volumes: ["pg_ms1:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taller -d taller_ms1"]
      interval: 5s
      timeout: 3s
      retries: 10

  db_ms2:
    image: postgres:16
    container_name: sgtm_db_ms2
    environment:
      POSTGRES_USER: taller
      POSTGRES_PASSWORD: taller
      POSTGRES_DB: taller_ms2
    ports: ["5434:5432"]
    volumes: ["pg_ms2:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taller -d taller_ms2"]
      interval: 5s
      timeout: 3s
      retries: 10

  db_ms3:
    image: postgres:16
    container_name: sgtm_db_ms3
    environment:
      POSTGRES_USER: taller
      POSTGRES_PASSWORD: taller
      POSTGRES_DB: taller_ms3
    ports: ["5435:5432"]
    volumes: ["pg_ms3:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taller -d taller_ms3"]
      interval: 5s
      timeout: 3s
      retries: 10

  db_ms4:
    image: postgres:16
    container_name: sgtm_db_ms4
    environment:
      POSTGRES_USER: taller
      POSTGRES_PASSWORD: taller
      POSTGRES_DB: taller_ms4
    ports: ["5436:5432"]
    volumes: ["pg_ms4:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taller -d taller_ms4"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_ms1:
  pg_ms2:
  pg_ms3:
  pg_ms4:
