# Alembic — migraciones del microservicio MS4 (Evidencia Multimedia).
#
# Cada servicio tiene su PROPIO Alembic porque cada uno apunta a su propia base
# (§8). La URL de la base NO se escribe aquí: env.py la toma del engine del
# servicio (services/ms4_evidencias/db.py, que la lee de .env con el prefijo
# MS4_), o bien de la conexión inyectada en `config.attributes["connection"]`
# (así los tests pueden migrar sobre SQLite en memoria sin tocar PostgreSQL).
#
# Los comandos se ejecutan SIEMPRE desde la carpeta backend/, por ejemplo:
#   alembic -c services/ms4_evidencias/alembic.ini upgrade head
#   alembic -c services/ms4_evidencias/alembic.ini revision --autogenerate -m "descripcion"

[alembic]
script_location = services/ms4_evidencias/alembic
prepend_sys_path = .
path_separator = os
# Nombre de las revisiones: 0001_descripcion, 0002_descripcion, ...
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
