# Configuración de Alembic (migraciones).
# La URL de la base de datos NO se pone aquí: env.py la toma de app.core.config
# (variable DATABASE_URL / archivo .env), para no duplicar credenciales.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# Nombre de las revisiones: 0001_descripcion, 0002_descripcion, ...
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
