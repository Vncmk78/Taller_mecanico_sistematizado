name: Verificación SGTM

on:
  push:
    branches: [MartinH, Develop, main]
  pull_request:
    branches: [Develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verificacion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Crear configuración exclusiva del runner
        run: python scripts/ambiente_pruebas.py configurar
      - name: Levantar PostgreSQL y MinIO propios
        run: python scripts/ambiente_pruebas.py infra
      - name: Comprobar contrato congelado
        env:
          SGTM_ENV_FILE: .env.pruebas
        run: python scripts/exportar_openapi.py --verificar
      - name: Suite completa, con PostgreSQL y S3 reales
        run: python scripts/verificar_backend.py
      - name: Conservar resultado sin configuración ni credenciales
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: resultado-backend
          path: |
            backend/.pruebas/logs/suite-backend.xml
            backend/.pruebas/logs/suite-backend.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Detener únicamente recursos del runner
        if: always()
        run: python scripts/ambiente_pruebas.py detener
